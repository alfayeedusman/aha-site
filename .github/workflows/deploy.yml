name: GitHub Pages redirects

# The public website is https://aha.yowtech.io on Hostinger, deployed with ./deploy/deploy.sh.
# GitHub does not host it. This workflow only publishes redirect stubs on GitHub Pages, so links
# already shipped in iOS app 1.0.0 (alfayeedusman.github.io/aha-site/privacy.html and
# support.html) land on aha.yowtech.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://aha.yowtech.io' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect stubs
        run: |
          mkdir stub
          page() { # file, target path on the real site
            url="${SITE_URL}$2"
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8">' \
              '<title>aha! - Where I Put It</title><meta name="robots" content="noindex">' \
              "<link rel=\"canonical\" href=\"$url\"><meta http-equiv=\"refresh\" content=\"0; url=$url\">" \
              "<script>location.replace(\"$url\")</script></head>" \
              "<body><p>aha! has moved to <a href=\"$url\">$url</a>.</p></body></html>" > "stub/$1"
          }
          page index.html /
          page privacy.html /privacy
          page support.html /#support
          page 404.html /
          cat stub/privacy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stub

  # Separate job (GitHub's recommended layout): deploying in the same job as the upload
  # intermittently fails with "No artifacts named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
